<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BT Shop - Pilihan fashion favorit untuk kamu.">
  <title>BT Shop | Fashion Pilihan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #ff6a00, #ff8c00);
      color: white;
      text-align: center;
      padding: 28px 16px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .container {
      width: min(100% - 24px, 1000px);
      margin: 22px auto 40px;
    }

    .section-title {
      text-align: center;
      margin: 0 0 18px;
      font-size: 22px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .card img {
      display: block;
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #eee;
    }

    .card-content {
      padding: 14px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      margin: 0 0 12px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 11px 12px;
      border-radius: 9px;
      background: #ff6a00;
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }

    .btn:hover {
      background: #e85f00;
    }

    footer {
      text-align: center;
      padding: 22px 12px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 26px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .card img {
        height: 230px;
      }

      .card-content {
        padding: 11px;
      }

      .title {
        font-size: 14px;
      }

      .btn {
        padding: 10px 8px;
        font-size: 13px;
      }
    }

    @media (max-width: 430px) {
      .products {
        grid-template-columns: 1fr;
      }

      .card img {
        height: 360px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ BT SHOP</h1>
    <p>Pilihan fashion favorit untuk kamu ✨</p>
  </header>

  <main class="container">
    <h2 class="section-title">Produk Pilihan</h2>

    <div class="products">

      <!-- PRODUK 1 -->
      <div class="card">
        <img src="kemeja.jpeg" alt="Kemeja Flanel Klasik">
        <div class="card-content">
          <div class="title">Kemeja Flanel Klasik</div>
          <a class="btn"
             href="https://vt.tokopedia.com/t/ZS9LgXKuf5Gcm-pMSby/"
             target="_blank"
             rel="noopener">
            Beli Sekarang
          </a>
        </div>
      </div>

      <!-- PRODUK 2 -->
      <div class="card">
        <img src="kebaya.jpeg" alt="Kebaya Modern">
        <div class="card-content">
          <div class="title">Kebaya Modern</div>
          <a class="btn"
             href="https://vt.tokopedia.com/t/ZS9LtCUQ1ge21-YWkoF/"
             target="_blank"
             rel="noopener">
            Beli Sekarang
          </a>
        </div>
      </div>

      <!-- PRODUK 3 -->
      <div class="card">
        <img src="gamis.png" alt="Gamis Elegan">
        <div class="card-content">
          <div class="title">Gamis Elegan</div>
          <a class="btn"
             href="https://vt.tokopedia.com/t/ZS9LtCHSXsFFX-1LguA/"
             target="_blank"
             rel="noopener">
            Beli Sekarang
          </a>
        </div>
      </div>

    </div>
  </main>

  <footer>
    © 2026 BT Shop
  </footer>

</body>
</html>
